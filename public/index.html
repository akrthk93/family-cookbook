<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Family Cookbook</title>
<meta name="description" content="Our family recipes, cook mode and shopping list.">
<meta name="theme-color" content="#EFF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cookbook">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: phone-first kitchen tool. Sticky header, scrolling list, fixed bottom tabs, full-screen cook mode overlay. */
:root{
  --bg:#EFF3F1; --surface:#FFFFFF; --sunk:#E2E9E5; --ink:#15201C; --muted:#56655F; --line:#D2DCD7;
  --accent:#1B6A50; --accent-ink:#FFFFFF; --accent-soft:#D6EBE2;
  --turmeric:#F0B429; --turmeric-ink:#2A1E00; --chilli:#B3361F;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101614; --surface:#18201D; --sunk:#222C28; --ink:#E7EEEA; --muted:#9AACA4; --line:#2D3833;
  --accent:#5CC29A; --accent-ink:#06261A; --accent-soft:#1D3A2F;
  --turmeric:#F2B93A; --turmeric-ink:#231800; --chilli:#F07A62; color-scheme:dark}}
html,body{background:var(--bg);margin:0;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
button,a,input,textarea,label,summary{touch-action:manipulation}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px;border-radius:8px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:24px;font-weight:800;line-height:1.1}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--body)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
main{padding-block:14px calc(120px + env(safe-area-inset-bottom,0px))}
.search{width:100%;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:17px;margin-top:10px;-webkit-appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card .t{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2}
.meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.ip{background:var(--accent-soft);color:var(--accent)}
.tag.local{background:var(--turmeric);color:var(--turmeric-ink)}
.empty{padding:32px 8px;text-align:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--sunk);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:58px;font-size:19px;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--chilli);background:transparent;border:1px solid var(--line)}
.btn svg,.icon svg,.mini svg,nav.tabs svg,.timer svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:20px;height:20px}
.icon{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px}
.icon svg{width:24px;height:24px}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:6px 4px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.fact b{display:block;font-size:12px;color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:.06em}
.fact span{font-variant-numeric:tabular-nums;font-weight:700}
.equip{color:var(--muted);font-size:15px}
section.block{margin-top:22px}
.scale{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.scale button{width:40px;height:40px;border-radius:9px;background:var(--sunk);font-size:22px;font-weight:700}
.scale output{min-width:72px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ing{list-style:none;margin:8px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ing li{border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing .grp{padding:12px 16px 4px}
.irow{display:flex;align-items:flex-start;gap:4px;padding:6px 6px 6px 4px}
.check{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:8px 6px 8px 10px;min-width:0;border-radius:10px}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);margin-top:1px;display:grid;place-items:center}
.done .box{background:var(--accent);border-color:var(--accent)}
.done .box::after{content:"";width:10px;height:6px;border:solid var(--accent-ink);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.done .itext{text-decoration:line-through;color:var(--muted)}
.qty{font-weight:700;font-variant-numeric:tabular-nums}
.mini{flex:none;min-width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:700}
.mini.on{color:var(--accent);background:var(--accent-soft)}
.mini svg{width:20px;height:20px}
.sub{margin:0 12px 10px 48px;padding:8px 12px;border-radius:10px;background:var(--sunk);font-size:15px}
.sub b{color:var(--accent)}
.steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:4px 10px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);line-height:1.1}
.steps .st{font-weight:700}
.steps p{margin:2px 0 0;grid-column:2}
.tchip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px 1px 6px;margin:1px 0;border-radius:99px;background:var(--turmeric);color:var(--turmeric-ink);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.5;vertical-align:baseline;white-space:nowrap}
.tchip svg{width:.95em;height:.95em;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nobr{white-space:nowrap}
.hint{margin:14px 0 0;color:var(--muted);font-size:15px}
.notes{margin:8px 0 0;padding-left:20px}
.notes li{margin-bottom:6px}
.src{font-size:15px;color:var(--muted);word-break:break-word}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:1fr 1fr 1fr;max-width:720px;margin:0 auto}
nav.tabs button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--chilli);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px;font-variant-numeric:tabular-nums}
.tray{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 8px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:720px;margin:0 auto}
.timer{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .tl{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tt{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.timer button{min-width:40px;height:36px;border-radius:9px;background:rgba(127,127,127,.25);font-size:14px;font-weight:700;padding:0 8px;display:grid;place-items:center}
.timer button svg{width:16px;height:16px;stroke-width:2.4}
.timer.ring{background:var(--turmeric);color:var(--turmeric-ink);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){.timer.ring{animation:none}}
.cook{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cook > .wrap{width:100%;min-width:0}
.cook .bar{padding-block:10px}
.cook .bar .row{min-width:0}
.cook .ttl{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;gap:4px;margin-top:8px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.cook .body{flex:1;overflow-y:auto;padding-block:18px;-webkit-overflow-scrolling:touch}
.cook .num{font-family:var(--display);font-weight:800;color:var(--accent);font-size:15px;text-transform:uppercase;letter-spacing:.08em}
.cook h2{font-size:32px;margin:6px 0 14px}
.cook .text{font-size:24px;line-height:1.45;max-width:34ch}
.cook .tchip{padding:2px 12px 2px 8px}
.cook .used{margin:0 0 18px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:17px}
.cook .nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding-block:10px 12px}
.cook .tray{position:static;padding:0;margin-top:10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:20px 20px 0 0;max-height:85%;overflow-y:auto;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px))}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);-webkit-appearance:none}
.shop .from{font-size:13px;color:var(--muted)}
.help{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
.help summary{padding:12px 0;font-weight:700;cursor:pointer}
.help ol{padding-left:20px;margin:0 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90%}
.form{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.form label small{font-weight:400;color:var(--muted)}
.form input,.form textarea{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:400;width:100%;-webkit-appearance:none}
.form textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:16px;line-height:1.5}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 label{min-width:0}
.confirm{background:var(--surface);border:1px solid var(--chilli);border-radius:12px;padding:12px;margin-top:8px}
.notice{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.notice.tip{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.publish{display:flex;flex-direction:column;gap:10px;margin-top:12px}
/* "Right now": what to cook for this slot of the week, above the full list */
.now{margin:2px 0 20px}
.now .kick{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.now h2{margin-top:2px}
.now .why{margin:4px 0 0;color:var(--muted);font-size:15px}
.now .eve{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--turmeric);color:var(--turmeric-ink);font-size:15px;font-weight:700}
.now .chips{padding-block:10px 0}
.now .chip{padding:6px 12px;font-size:14px}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:10px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:min(78%,300px);scroll-snap-align:start;display:flex;flex-direction:column}
.rail .card.pick{border:2px solid var(--accent);background:var(--accent-soft)}
.rail .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.rail .meta{margin-top:auto;padding-top:6px}
.now .none{margin:10px 0 0;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:15px}
.listhead{margin:0 0 8px}
.made{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.made .btn{min-height:40px}
.sched{list-style:none;margin:10px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sched li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px 8px 16px;border-top:1px solid var(--line)}
.sched li:first-child{border-top:0}
.sched label{font-weight:700}
.sched select{min-width:0;flex:0 1 190px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.cmp-sum{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:15px;min-height:44px;display:flex;align-items:center}
.cmp-sum.none{background:var(--sunk);color:var(--muted)}
.cmp-sum b{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px}
.opt.best{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.opt .top{display:flex;gap:8px;align-items:center}
.opt .top input{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:17px;padding:6px 0}
.opt .top input::placeholder{color:var(--muted);font-weight:700}
.fields{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 76px 58px;gap:8px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.fields input,.fields select{width:100%;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:17px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.fields select{padding-right:6px;text-align:center}
.money{position:relative}
.money span{position:absolute;left:10px;bottom:11px;color:var(--muted);font-size:17px;pointer-events:none}
.money input{padding-left:22px}
.res{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:28px;font-variant-numeric:tabular-nums}
.res .per{font-weight:700;font-size:18px}
.res .sub100{color:var(--muted);font-size:14px}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.best{background:var(--accent);color:var(--accent-ink)}
.pill.more{background:var(--sunk);color:var(--chilli)}
.pill.same{background:var(--sunk);color:var(--muted)}
.res .wait{color:var(--muted);font-size:15px}
:root{--d0:#1B6A50;--d1:#B97A00;--d2:#B3361F;--d3:#2F6FB0}
@media (prefers-color-scheme: dark){:root{--d0:#5CC29A;--d1:#F2B93A;--d2:#F07A62;--d3:#7FB2E5}}
body.locked{overflow:hidden}
.muted{color:var(--muted)} .small{font-size:14px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;background:var(--d0)}
.dot.d1{background:var(--d1)} .dot.d2{background:var(--d2)} .dot.d3{background:var(--d3)}
.together-btn{width:100%;margin-bottom:14px;justify-content:center}
.pickhelp{margin:0 0 12px;color:var(--muted)}
.card.pickable{position:relative;padding-right:52px}
.card.picked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pickmark{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--accent-ink)}
.card.picked .pickmark{background:var(--accent);border-color:var(--accent)}
.pickbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.pickbar .btn.primary[disabled]{opacity:.45}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.banner .dots{display:flex;flex-direction:column;gap:3px}
.dishes{list-style:none;margin:8px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dishes li{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
.dishes li:first-child{border-top:0}
.dishes .dn{flex:1;min-width:0;font-weight:700}
.scale.sm{padding:3px}
.scale.sm button{width:34px;height:34px;font-size:20px}
.scale.sm output{min-width:32px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-top:8px;border-radius:12px;background:var(--sunk)}
.seg button{min-height:44px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.preview .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1}
.plan{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}

<script src="./plan.js"></script>
<script>
"use strict";
const REPO = "__REPO__";            // owner/name, filled in at build time
const SHORTCUT = "Add to Family List";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
const ICON = {
  back: svg('<path d="M15 5l-7 7 7 7"/>'),
  close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  cart: svg('<path d="M3 4h2l2.4 11h11L21 7H6.2"/><path d="M14 2v6M11 5h6"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  clock: svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>'),
  pots: svg('<path d="M3 11h18M5 11v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6M8 11V9M16 11V9M9 5c0 1 1 1 1 2M14 5c0 1 1 1 1 2"/>'),
  edit: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
  trash: svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  share: svg('<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/>'),
  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>')
};

/* ---------- storage ---------- */
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---------- state ---------- */
const S = {
  ready:false, loadFailed:false,
  shared:[], local: lsGet("localRecipes", {}),   // local = saved on this phone, not yet in the published list
  deleted: lsGet("deleted", []).filter(e => e && typeof e === "object"),   // {id, at}: deleted here, hidden until the site rebuilds without it (10 min at most)
  token: lsGet("ghToken", ""), settings:false, confirmDel:false, busy:false,
  get recipes(){
    const shared = this.shared.filter(r => !this.deleted.some(e => e.id === r.id)).map(r => { const l = this.local[r.id]; return l ? { ...l, _local: !l._pushed, _pending: !!l._pushed } : r; });
    const extra = Object.values(this.local).filter(l => !this.shared.some(r => r.id === l.id)).map(l => ({ ...l, _local: !l._pushed, _pending: !!l._pushed }));
    return [...shared, ...extra];
  },
  shop: lsGet("shop", []),
  view:"list", tab:"recipes", rid:null,
  q:"", tag:null,
  scale:{}, checked: lsGet("ck", {}), openSub:{},
  cook:null, sheet:false, editing:null, published:null, confirmClear:false,
  timers:[], tipHidden: lsGet("tipHidden", false),
  made: lsGet("made", {}),            // id -> {at, prev}: when this phone last marked it made
  sched: lsGet("sched", null), slot:null   // slot = plan picked by hand on the list screen (null = follow the clock)
};
const saveShop = () => { lsSet("shop", S.shop); };

/* ---------- what to cook right now ---------- */
// Each plan is a slot of the week. A recipe shows up in a plan when it carries one of the plan's tags.
const PLANS = {
  breakfast: { name:"Breakfast", tags:["Breakfast","Drinks","Drink"], why:"Something quick before the day starts." },
  prep:      { name:"Sunday block", tags:["Sunday block","Lunch batch"], why:"Lunch batch in the Instant Pot, sambar for dosa nights, and any freezer cubes running low.",
               eve:"Move the chicken for the lunch batch from the freezer to the fridge tonight." },
  dosa:      { name:"Dosa night", tags:["Dosa night"], why:"Sambar from the freezer and a fresh chutney. Crack an egg on the dosa for protein.",
               eve:"Move a sambar box from the freezer to the fridge tonight." },
  component: { name:"Component night", tags:["Weeknight"], why:"20 minutes or less, built from what's already prepped." },
  weekend:   { name:"Weekend cook", tags:["Weekend"], why:"Time for something slower." },
  off:       { name:"Night off", tags:[], why:"Eating out or leftovers. Nothing to cook." }
};
const DAY_PLANS = ["prep","component","dosa","weekend","off"];
const DEFAULT_SCHED = ["prep","component","dosa","component","dosa","weekend","weekend"];   // Sun..Sat
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const sched = () => DEFAULT_SCHED.map((p, i) => PLANS[S.sched?.[i]] ? S.sched[i] : p);
function slotNow(d = new Date()){
  const h = d.getHours() + d.getMinutes() / 60, day = d.getDay(), s = sched();
  if (h >= 21.5) { const p = s[(day + 1) % 7]; return { plan:p, when:"Tomorrow", eve: PLANS[p].eve }; }
  if (h < 10) return { plan:"breakfast", when:"This morning", later: s[day] };
  return { plan: s[day], when: h >= 15 && s[day] !== "prep" ? "Tonight" : "Today" };
}
const madeAt = id => S.made[id]?.at || 0;
const dayStart = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function ago(t){
  if (!t) return "Not made yet";
  const n = Math.round((dayStart(Date.now()) - dayStart(t)) / 864e5);
  return n <= 0 ? "Made today" : n === 1 ? "Made yesterday" : n < 14 ? `Made ${n} days ago` : n < 60 ? `Made ${Math.round(n/7)} weeks ago` : `Made ${Math.round(n/30)} months ago`;
}
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h; };
const thisWeek = () => Math.floor((Date.now() / 864e5 + 4) / 7);
// Least recently made first; recipes never made rotate by week so the same one doesn't always lead.
const byMade = (a, b) => madeAt(a.id) - madeAt(b.id) || hash(a.id + thisWeek()) - hash(b.id + thisWeek());
const tagged = (r, tags) => (r.tags || []).some(t => tags.includes(t));
function markMade(id){
  const cur = S.made[id];
  if (cur && dayStart(cur.at) === dayStart(Date.now())) return;   // already counted today
  S.made[id] = { at: Date.now(), prev: cur?.at || 0 }; lsSet("made", S.made);
}
function unmarkMade(id){
  const prev = S.made[id]?.prev;
  if (prev) S.made[id] = { at: prev, prev: 0 }; else delete S.made[id];
  lsSet("made", S.made);
}

/* ---------- quantities ---------- */
/* ---------- times in step text -> timers ---------- */
const DUR = /(\d+(?:\.\d+)?|[½¼¾])(?:\s*(?:[–-]|to)\s*(\d+(?:\.\d+)?))?\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?)\b(?!\s+(?:less|more|past|longer|before|after|under|over|shorter)\b)/gi;
function durations(text){
  const out = [];
  for (const m of String(text).matchAll(DUR)) {
    const lo = { "½":.5, "¼":.25, "¾":.75 }[m[1]] ?? parseFloat(m[1]);
    const u = m[3].toLowerCase(), mult = u.startsWith("s") ? 1 : u.startsWith("h") ? 3600 : 60;
    out.push({ start: m.index, end: m.index + m[0].length, label: m[0], secs: Math.round(lo * mult) });
  }
  return out;
}
/* step text with every time turned into a tap-to-start timer chip */
function stepHtml(s, i){
  const d = durations(s.x); let html = "", at = 0;
  d.forEach((t, j) => {
    const punct = (s.x.slice(t.end).match(/^[.,;:!?)]+/) || [""])[0];
    html += esc(s.x.slice(at, t.start)) + `<span class="nobr"><button class="tchip" data-act="timer" data-i="${i}" data-j="${j}">${ICON.clock}${esc(t.label)}</button>${esc(punct)}</span>`;
    at = t.end + punct.length;
  });
  return html + esc(s.x.slice(at));
}

/* ---------- which ingredients go into which step ---------- */
const STOP = new Set("medium large small fresh dried boneless skinless finely chopped whole plain cooked frozen extra virgin sharp thick ground packed sliced diced minced divided optional reserved white black green yellow red light dark heaped taco sized pieces piece cloves clove grated thin thinly roughly bite with about room temp temperature cut into neutral olive vegetable sunflower cooking smooth crushed warmed softened beaten halved quartered peeled unpeeled rinsed drained soaked trimmed patted dry powder paste flakes leaves leaf seeds pods pod stick sprig can cans tin of and the for to taste serve serving garnish".split(" "));
const stem = w => w.replace(/(ies)$/, "y").replace(/(oes|ches|shes)$/, m => m.slice(0, -2)).replace(/s$/, "");
const words = s => s.toLowerCase().split(/[^a-z]+/).filter(Boolean);
function ingKeywords(name){
  const core = name.split(/[,(]/)[0];
  return core.split(/\s+or\s+/i).map(alt => words(alt).filter(w => w.length > 2 && !STOP.has(w)).map(stem)).filter(a => a.length);
}
/* Precision over recall: every keyword of one alternative must appear in the step text.
   Each ingredient is listed once, at the step where it goes in, unless its name says "divided". */
function guessUses(groups, steps){
  const used = new Set();
  return steps.map(s => {
    const have = new Set(words(s.x + " " + s.t).map(stem));
    const keys = [];
    (groups || []).forEach((g, gi) => g.items.forEach((it, ii) => {
      const key = gi + "." + ii;
      if (it.q == null || (used.has(key) && !/divided/i.test(it.n))) return;
      if (ingKeywords(it.n).some(alt => alt.every(w => have.has(w)))) { keys.push(key); used.add(key); }
    }));
    return keys;
  });
}
function stepUses(r, i){
  const s = r.steps[i];
  if (Array.isArray(s.uses)) return s.uses;
  if (!r._guess) Object.defineProperty(r, "_guess", { value: guessUses(r.groups, r.steps), enumerable: false });
  return r._guess[i] || [];
}
const FR = [[0,""],[.125,"⅛"],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"],[1,""]];
function fmtQ(q, u){
  if (q == null) return "";
  if (u === "g" || u === "ml") {
    if (q >= 100) q = Math.round(q/5)*5; else if (q >= 10) q = Math.round(q); else q = Math.round(q*10)/10;
    return String(q);
  }
  let w = Math.floor(q + 1e-9), f = q - w, best = FR[0];
  for (const c of FR) if (Math.abs(c[0]-f) < Math.abs(best[0]-f)) best = c;
  if (best[0] === 1) { w += 1; best = FR[0]; }
  if (w === 0 && !best[1]) return q > 0 ? "⅛" : "0";
  return (w ? String(w) : "") + best[1];
}
const fmtU = (q, u) => !u ? "" : u === "cup" ? (q != null && q > 1.01 ? "cups" : "cup") : u;
function ingLine(it, k){
  const q = it.q == null ? null : it.q * k;
  const qs = fmtQ(q, it.u), us = fmtU(q, it.u);
  return { qty: [qs, us].filter(Boolean).join(it.u==="g"||it.u==="ml" ? "" : " "), name: it.n };
}
const factor = r => (S.scale[r.id] || r.serves || 1) / (r.serves || 1);
const shopText = (it, k) => { const l = ingLine(it, k); return (l.qty ? l.qty + " " : "") + l.name; };

/* ---------- data ---------- */
async function load(){
  try {
    const res = await fetch("./recipes.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    S.shared = await res.json();
    // drop local copies that have now landed on GitHub unchanged
    for (const id of Object.keys(S.local)) if (S.shared.some(r => r.id === id && (r.updated || 0) >= (S.local[id].updated || 0))) delete S.local[id];
    lsSet("localRecipes", S.local);
    S.deleted = S.deleted.filter(e => Date.now() - e.at < 600000 && S.shared.some(r => r.id === e.id));
    lsSet("deleted", S.deleted);
  } catch { S.loadFailed = true; }
  S.ready = true;
  if (S.session) { restoreSessionTimers(); S.sessionOpen = true; fillHands(); }
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && S.recipes.some(r => r.id === h)) { S.view = "recipe"; S.rid = h; }
  render();
}

let tId; function toast(msg){
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role","status"); document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(tId); tId = setTimeout(() => t.hidden = true, 2200);
}

/* ---------- shopping (on this phone, handed to Reminders) ---------- */
function addShop(items){
  let n = 0;
  for (const it of items) {
    if (S.shop.some(s => !s.done && s.name.toLowerCase() === it.name.toLowerCase())) continue;
    S.shop.push({ id: Math.random().toString(36).slice(2), name: it.name, from: it.from || "", done:false, at: Date.now() + n }); n++;
  }
  saveShop(); render();
  toast(n ? `Added ${n} item${n>1?"s":""} to shopping list` : "Already on the list");
}

/* ---------- wake lock ---------- */
let lock = null;
async function wake(on){
  try {
    if (on && !lock && "wakeLock" in navigator) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); }
    if (!on && lock) { await lock.release(); lock = null; }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (S.view === "recipe" || S.sessionOpen)) wake(true); });

/* ---------- timers ---------- */
let actx = null;
function audio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch {} }
function beep(){
  if (!actx) return;
  try {
    const t0 = actx.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.type = "square"; g.gain.value = .0001;
      o.connect(g); g.connect(actx.destination);
      const s = t0 + i*.35; g.gain.exponentialRampToValueAtTime(.25, s+.02); g.gain.exponentialRampToValueAtTime(.0001, s+.25);
      o.start(s); o.stop(s+.3);
    }
  } catch {}
}
function startTimer(label, min, key){
  audio();
  const t = { id: Math.random().toString(36).slice(2), label, end: Date.now() + min*60000, ring:false, key };
  S.timers.push(t); renderTray(); return t;
}
const mmss = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
let lastBeep = 0;
setInterval(() => {
  if (S.session) sessionTick();
  if (!S.timers.length) return;
  const now = Date.now(); let ringing = false;
  for (const t of S.timers) { if (!t.ring && now >= t.end) t.ring = true; if (t.ring) ringing = true; }
  if (ringing && now - lastBeep > 2500) { lastBeep = now; beep(); try { navigator.vibrate?.([300,150,300]); } catch {} }
  renderTray();
}, 500);
function renderTray(){
  const html = S.timers.map(t => `<div class="timer ${t.ring?"ring":""}">
    <div class="tl">${t.ring ? "Done: " : ""}${esc(t.label)}</div>
    <div class="tt">${t.ring ? "0:00" : mmss(t.end - Date.now())}</div>
    ${t.ring ? `<button data-act="tdone" data-t="${t.id}">OK</button>` : `<button data-act="tadd" data-t="${t.id}" aria-label="Add one minute">+1m</button><button data-act="tdone" data-t="${t.id}" aria-label="Cancel timer">${ICON.close}</button>`}
  </div>`).join("");
  $("#tray").innerHTML = S.cook || S.sessionOpen ? "" : html;
  const ct = $("#cookTray"); if (ct) ct.innerHTML = S.cook ? html : "";
}

/* ---------- parsing (editor + paste import) ---------- */
const UNITS = { g:"g",gram:"g",grams:"g",kg:"kg",ml:"ml",l:"l",litre:"l",liter:"l",tsp:"tsp",teaspoon:"tsp",teaspoons:"tsp",tbsp:"tbsp",tablespoon:"tbsp",tablespoons:"tbsp",cup:"cup",cups:"cup",oz:"oz" };
const UF = { "¼":.25,"½":.5,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125 };
function parseIng(line){
  let s = line.replace(/^\s*(?:[-*•]|\d+\.)\s+/, "").trim();
  let sub = null; const bar = s.indexOf(" | ");
  if (bar > -1) { sub = s.slice(bar+3).replace(/^sub(stitute)?:\s*/i, "").trim(); s = s.slice(0, bar).trim(); }
  const num = "(\\d+\\s+\\d+\\s*\\/\\s*\\d+|\\d+\\s*\\/\\s*\\d+|\\d+(?:\\.\\d+)?(?:\\s*[¼½¾⅓⅔⅛])?|[¼½¾⅓⅔⅛])";
  const m = s.match(new RegExp("^" + num + "(?:\\s*[-–]\\s*" + num + ")?\\s*(.*)$"));
  const val = t => {
    if (!t) return null; t = t.trim(); let m2;
    if ((m2 = t.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))) return +m2[1] + m2[2]/m2[3];
    if ((m2 = t.match(/^(\d+)\s*\/\s*(\d+)$/))) return m2[1]/m2[2];
    if ((m2 = t.match(/^(\d+(?:\.\d+)?)\s*([¼½¾⅓⅔⅛])$/))) return +m2[1] + UF[m2[2]];
    if (UF[t] != null) return UF[t];
    return parseFloat(t);
  };
  if (!m) return { q:null, u:"", n:s, ...(sub ? {sub} : {}) };
  let q = val(m[1]); const q2 = val(m[2]); if (q2 != null) q = (q + q2) / 2;
  let rest = m[3] || "", u = "";
  const um = rest.match(/^\(?([A-Za-z]+)\.?\)?\b\s*(.*)$/);
  if (um && UNITS[um[1].toLowerCase()]) { u = UNITS[um[1].toLowerCase()]; rest = um[2]; }
  rest = rest.replace(/^of\s+/, "");
  return { q, u, n: rest || s, ...(sub ? {sub} : {}) };
}
function ingsToText(groups){
  return (groups||[]).map(g => (g.g ? `### ${g.g}\n` : "") + g.items.map(it => {
    const q = it.q == null ? "" : fmtQ(it.q, it.u) + (it.u ? (it.u==="g"||it.u==="ml" ? it.u : " " + it.u) : "");
    return (q ? q + " " : "") + it.n + (it.sub ? " | " + it.sub : "");
  }).join("\n")).join("\n\n");
}
function textToIngs(text){
  const groups = []; let cur = { g:null, items:[] };
  for (const raw of text.split("\n")) {
    const l = raw.trim(); if (!l) continue;

/* ---------- saving: commits straight to the repo with this phone's token ---------- */
const API = `https://api.github.com/repos/${REPO}`;
const recipeJson = r => { const { _local, _pending, _pushed, ...rest } = r; return JSON.stringify(rest, null, 2) + "\n"; };
const b64 = s => { const bytes = new TextEncoder().encode(s); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
class SaveError extends Error {}
async function gh(path, opts = {}){
  if (!S.token) throw new SaveError("Saving isn't set up on this phone yet");
  let res;
  try {
    res = await fetch(API + path, { ...opts, headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + S.token, "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  } catch { throw new SaveError("You're offline. It's saved on this phone; tap Save for everyone when you're back online"); }
  if (res.status === 401) throw new SaveError("The saving key was rejected. It may have expired; add a new one in Settings");
  if (res.status === 403 || res.status === 404 && !opts.allow404) {
    if (res.status === 404 && path.startsWith("/contents")) throw new SaveError("The saving key can't see the recipes. Check it has access to family-cookbook with Contents: Read and write");
    if (res.status === 403) throw new SaveError("The saving key doesn't have permission to change recipes. Give it Contents: Read and write");
  }
  return res;
}
async function fileSha(id){
  const res = await gh(`/contents/recipes/${encodeURIComponent(id)}.json?ref=main`, { allow404: true });
  if (res.status === 404) return null;
  if (!res.ok) throw new SaveError("Couldn't reach GitHub. Try again in a moment");
  return (await res.json()).sha;
}
async function pushRecipe(r){
  const sha = await fileSha(r.id);
  const res = await gh(`/contents/recipes/${encodeURIComponent(r.id)}.json`, { method: "PUT", body: JSON.stringify({
    message: `${sha ? "Update" : "Add"} recipe: ${r.title}`, content: b64(recipeJson(r)), branch: "main", ...(sha ? { sha } : {})
  }) });
  if (res.status === 409 || res.status === 422) throw new SaveError("Someone changed this recipe at the same moment. Reopen it and try again");
  if (!res.ok) throw new SaveError("Couldn't save to GitHub. Try again in a moment");
}
async function deleteRecipe(r){
  const sha = await fileSha(r.id);
  if (!sha) return;
  const res = await gh(`/contents/recipes/${encodeURIComponent(r.id)}.json`, { method: "DELETE", body: JSON.stringify({ message: `Delete recipe: ${r.title}`, sha, branch: "main" }) });
  if (!res.ok) throw new SaveError("Couldn't delete on GitHub. Try again in a moment");
}
async function checkToken(t){
  const res = await fetch(API, { headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + t } }).catch(() => null);
  if (!res) return "You're offline. Try again with a connection";
  if (res.status === 401) return "GitHub didn't accept that key. Copy it again and paste the whole thing";
  if (res.status === 404) return "That key can't see family-cookbook. Give it access to that repository";
  if (!res.ok) return "Couldn't check the key right now. Try again";
  const j = await res.json();
  if (j.permissions && !j.permissions.push) return "That key can read but not save. Set Contents to Read and write";
  return null;
}

/* ---------- price comparison ---------- */
const UNIT = { g:["mass",.001], kg:["mass",1], ml:["vol",.001], l:["vol",1], pcs:["count",1] };
const PER = { mass:["kg","100g",.1], vol:["L","100ml",.1], count:["piece",null,null] };
const newOpt = () => ({ id: Math.random().toString(36).slice(2, 8), name:"", price:"", size:"", unit:"g", packs:"1" });
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) && n > 0 ? n : null; };
S.cmp = lsGet("cmp", null) || [newOpt(), newOpt()];
const money = n => n >= 100 ? "$" + n.toFixed(0) : n >= 10 ? "$" + n.toFixed(2) : "$" + n.toFixed(2);
function unitPrice(o){
  const price = num(o.price), size = num(o.size), packs = num(o.packs) || 1, [dim, f] = UNIT[o.unit] || UNIT.g;
  if (price == null || size == null) return null;
  return { dim, per: price / (size * packs * f) };
}
/* Compares options that share a kind of unit (weight, volume, pieces); the kind most options use wins. */
function compareAll(){
  const rows = S.cmp.map(o => ({ o, u: unitPrice(o) }));
  const count = {}; rows.forEach(r => r.u && (count[r.u.dim] = (count[r.u.dim] || 0) + 1));
  const dim = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  const pool = rows.filter(r => r.u && r.u.dim === dim);
  const best = pool.length ? Math.min(...pool.map(r => r.u.per)) : null;
  return { rows, dim, best, ready: pool.length };
}
const optName = (o, i) => o.name.trim() || `Option ${i + 1}`;
function resHtml(r, c){
  if (!r.u) return `<span class="wait">Enter price and size</span>`;
  const [big, small, k] = PER[r.u.dim];
  const line = `<span class="per">${money(r.u.per)} / ${big}</span>${small ? `<span class="sub100">${money(r.u.per * k)} / ${small}</span>` : ""}`;
  if (r.u.dim !== c.dim) return line + `<span class="pill same">Can't compare: different unit</span>`;
  if (c.ready < 2) return line;
  const diff = (r.u.per / c.best - 1) * 100;
  return line + (diff < 0.5 ? `<span class="pill best">Best value</span>` : `<span class="pill more">+${diff < 10 ? diff.toFixed(1) : Math.round(diff)}% more</span>`);
}
function sumHtml(c){
  if (c.ready < 2) return [`Fill in at least two options to compare`, true];
  const ranked = c.rows.map((r, i) => ({ ...r, i })).filter(r => r.u && r.u.dim === c.dim).sort((a, b) => a.u.per - b.u.per);
  const [a, b] = ranked, big = PER[c.dim][0];
  if (b.u.per / a.u.per - 1 < 0.005) return [`<span><b>${esc(optName(a.o, a.i))}</b> and <b>${esc(optName(b.o, b.i))}</b> cost the same per ${big}</span>`, false];
  const save = b.u.per - a.u.per;
  return [`<span><b>${esc(optName(a.o, a.i))}</b> is cheapest, ${money(save)}/${big} less than ${esc(optName(b.o, b.i))}</span>`, false];
}
/* Update results in place, so typing never re-renders the inputs. */
function paintCompare(){

    const el = document.getElementById("res-" + r.o.id); if (el) el.innerHTML = resHtml(r, c);
    const card = document.getElementById("opt-" + r.o.id); if (card) card.classList.toggle("best", c.ready >= 2 && !!r.u && r.u.dim === c.dim && r.u.per / c.best - 1 < 0.005);

/* ---------- cook together ---------- */
S.session = lsGet("session", null);      // the running session, kept across app restarts
S.pick = null; S.together = null; S.sessionOpen = false; S.confirmEnd = false;
const saveSession = () => lsSet("session", S.session);
const GOALS = { together: ["Serve together", "Shorter dishes start later so everything is hot at the same time."],
                fast:     ["Done fastest", "Shortest total time. Dishes finish when they finish, good for batch prep."] };
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase().replace(/\s/g, "");
function fmtDur(min){ min = Math.max(1, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h} hr${m ? ` ${m} min` : ""}` : `${m} min`; }
const shortName = r => r.title.replace(/\s*\([^)]*\)\s*/g, " ").replace(/^(Instant Pot|One-Pot|Air Fryer|Quick)\s+/i, "").trim();

function sessionDishes(sess){
  return sess.ids.map(id => {
    const r = S.recipes.find(x => x.id === id); if (!r) return null;
    return { r, steps: CookPlan.modelSteps(r), prep: CookPlan.prepTasks(r, i => stepUses(r, i), CookPlan.modelSteps(r)), k: (sess.servings[id] || r.serves || 1) / (r.serves || 1) };
  });
}
const toMin = (sess, ms) => (ms - sess.startedAt) / 60000;
function planSession(sess, D){
  D = D || sessionDishes(sess);
  if (D.some(d => !d)) return null;
  const now = toMin(sess, Date.now());
  const actOf = key => { const [kind, di, n] = CookPlan.parseKey(key); return kind === "s" ? D[di].steps[n].act : (D[di].prep.find(p => p.feeds === n)?.act || 2); };
  const state = {
    now,
    dishes: sess.dishes.map(d => ({ next: d.next, waitEnd: Object.fromEntries(Object.entries(d.waitEnd).map(([k, ms]) => [k, toMin(sess, ms)])) })),
    prepDone: new Set(sess.prepDone),
    busy: sess.busy.map(b => ({ key: b.key, until: toMin(sess, b.at) + actOf(b.key) })),
  };
  return CookPlan.plan(D.map(d => ({ steps: d.steps, prep: d.prep })), state, { hands: sess.hands, mode: sess.mode });
}
function newSession(cfg){
  return { ids: [...cfg.ids], servings: { ...cfg.servings }, mode: cfg.mode, hands: cfg.hands, startedAt: Date.now(),
           dishes: cfg.ids.map(() => ({ next: 0, waitEnd: {} })), prepDone: [], busy: [] };
}
/* Give every free pair of hands the task the plan starts now. */
function fillHands(){
  const sess = S.session; if (!sess || sess.busy.length >= sess.hands) return;
  const p = planSession(sess); if (!p) return;
  const now = toMin(sess, Date.now());
  const next = p.tasks.filter(t => !t.busy && t.start <= now + 0.01).sort((a, b) => a.start - b.start);
  for (const t of next) { if (sess.busy.length >= sess.hands) break; sess.busy.push({ key: t.key, at: Date.now() }); }
  saveSession();
}
function sessionDone(sess, D){
  return sess.dishes.every((d, di) => d.next >= D[di].steps.length && Object.values(d.waitEnd).every(ms => ms <= Date.now())) &&
         D.every((d, di) => d.prep.every(p => sess.prepDone.includes(`p${di}.${p.feeds}`))) && !sess.busy.length;
}
function completeTask(key, skip){
  const sess = S.session, D = sessionDishes(sess), [kind, di, n] = CookPlan.parseKey(key);
  sess.busy = sess.busy.filter(b => b.key !== key);
  if (kind === "p") { if (!sess.prepDone.includes(key)) sess.prepDone.push(key); }
  else {
    const st = D[di].steps[n], dish = sess.dishes[di];
    dish.next = Math.max(dish.next, n + 1);
    if (st.wait > 0 && !skip) {
      dish.waitEnd[n] = Date.now() + st.wait * 60000;
      startTimer(`${shortName(D[di].r)}: ${st.t}`, st.wait, `${di}.${n}`);
    }
  }
  saveSession(); fillHands();
}
function changeWait(di, n, ms){
  const sess = S.session, dish = sess.dishes[di];
  if (ms == null) { delete dish.waitEnd[n]; S.timers = S.timers.filter(t => t.key !== `${di}.${n}`); }
  else { dish.waitEnd[n] = ms; S.timers.forEach(t => { if (t.key === `${di}.${n}`) { t.end = ms; t.ring = false; } }); }
  saveSession(); fillHands(); renderTray();
}
let lastTick = Date.now();
function sessionTick(){
  const now = Date.now(), sess = S.session;
  document.querySelectorAll("[data-until]").forEach(el => { el.textContent = mmss(+el.dataset.until - now); });
  const crossed = sess.dishes.some(d => Object.values(d.waitEnd).some(ms => ms > lastTick && ms <= now));
  lastTick = now;
  if (crossed) { fillHands(); if (S.sessionOpen) render(); }
}
function restoreSessionTimers(){
  const sess = S.session; if (!sess) return;
  const D = sessionDishes(sess); if (D.some(d => !d)) return;
  sess.dishes.forEach((d, di) => Object.entries(d.waitEnd).forEach(([n, ms]) => {
    if (ms > Date.now() && !S.timers.some(t => t.key === `${di}.${n}`))
      S.timers.push({ id: Math.random().toString(36).slice(2), label: `${shortName(D[di].r)}: ${D[di].steps[n].t}`, end: ms, ring: false, key: `${di}.${n}` });
  }));
}

/* What a task is, for the screen */
function taskInfo(D, key){
  const [kind, di, n] = CookPlan.parseKey(key), d = D[di], r = d.r;
  if (kind === "p") {
    const p = d.prep.find(x => x.feeds === n);
    const items = (p?.items || []).map(k => { const [gi, ii] = k.split(".").map(Number); return ingLine(r.groups[gi].items[ii], d.k); });
    return { kind, di, n, r, title: "Get ready: chop and measure", sub: `for “${r.steps[n].t}”`, items, act: p?.act || 2 };
  }
  const st = d.steps[n], raw = r.steps[n];
  const items = stepUses(r, n).map(k => { const [gi, ii] = k.split(".").map(Number); const it = r.groups[gi]?.items[ii]; return it ? ingLine(it, d.k) : null; }).filter(Boolean);
  return { kind, di, n, r, title: raw.t, sub: `Step ${n + 1} of ${r.steps.length}`, text: raw.x, items, act: st.act, wait: st.wait, on: st.on };
}
const dot = di => `<span class="dot d${di % 4}" aria-hidden="true"></span>`;
const boldTimes = text => { let h = "", at = 0; for (const t of durations(text)) { h += esc(text.slice(at, t.start)) + `<b>${esc(t.label)}</b>`; at = t.end; } return h + esc(text.slice(at)); };

function sessionBanner(){
  const sess = S.session, D = sessionDishes(sess);

  const p = planSession(sess, D), done = sessionDone(sess, D);

    <span style="flex:1;min-width:0"><b>Cooking ${D.length} dishes</b><br><span class="muted">${done ? "Everything's ready" : `Ready around ${clock(sess.startedAt + p.finish * 60000)}`}</span></span>
    <span class="btn primary" style="min-height:40px">Resume</span>
  </button>`;
}

function viewSession(){
  const sess = S.session, D = sessionDishes(sess);
  if (D.some(d => !d)) return `<div class="cook"><div class="wrap bar"><button class="icon" data-act="sessionClose" aria-label="Close">${ICON.close}</button></div><div class="wrap body"><p class="notice">A recipe in this session was deleted. End the session to start a new one.</p><button class="btn danger" data-act="endYes">End session</button></div></div>`;
  const p = planSession(sess, D), now = Date.now(), nowM = toMin(sess, now), done = sessionDone(sess, D);
  // waits still running, plus finished ones whose alarm hasn't been acknowledged yet
  const waits = sess.dishes.flatMap((d, di) => Object.entries(d.waitEnd).map(([n, ms]) => ({ di, n: +n, ms })))
    .filter(w => w.ms > now || S.timers.some(t => t.key === `${w.di}.${w.n}`)).sort((a, b) => a.ms - b.ms);
  const nowCards = sess.busy.map(b => {
    const i = taskInfo(D, b.key);
    return `<article class="now d${i.di % 4}">
      <div class="who">${dot(i.di)}<span>${esc(shortName(i.r))}</span><span class="kind">${esc(i.sub)}</span></div>
      <h2>${esc(i.title)}</h2>
      ${i.items.length ? `<ul class="gin">${i.items.map(l => `<li>${l.qty ? `<b>${esc(l.qty)}</b> ` : ""}${esc(l.name)}</li>`).join("")}</ul>` : ""}
      ${i.text ? `<p class="text">${boldTimes(i.text)}</p>` : ""}
      ${i.kind === "s" && i.wait ? `<p class="muted small">Tap Done when the hands-on part is finished. A ${fmtDur(i.wait)} timer starts, and you'll get something else to do meanwhile.</p>` : ""}
      <div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="taskDone" data-key="${b.key}">Done</button>${i.kind === "s" ? `<button class="btn ghost" data-act="taskSkip" data-key="${b.key}">Skip</button>` : ""}</div>
    </article>`;
  });
  const upcoming = p.tasks.filter(t => !t.busy).sort((a, b) => a.start - b.start);
  if (!done) for (let h = sess.busy.length; h < sess.hands; h++) {
    const nxt = upcoming[0];
    const when = nxt ? Math.max(0, nxt.start - nowM) : null;
    nowCards.push(`<article class="now idle"><h2>Nothing to do right now</h2>
      <p class="muted">${nxt ? `Next up${when >= 0.5 ? ` in about ${fmtDur(when)}` : ""}: <b>${esc(taskInfo(D, nxt.key).title)}</b> (${esc(shortName(D[nxt.dish].r))}).` : ""} Tidy up or wash a pan.</p></article>`);
  }
  return `<div class="cook session" role="dialog" aria-label="Cook together">
    <div class="wrap bar"><div class="row between">
      <button class="icon" data-act="sessionClose" aria-label="Leave the session screen (it keeps running)">${ICON.back}</button>
      <div class="ttl">${done ? "Everything's ready" : `Ready around ${clock(sess.startedAt + p.finish * 60000)}`}</div>
      <button class="btn ghost" data-act="endAsk" style="min-height:40px">End</button>
    </div>
    ${S.confirmEnd ? `<div class="confirm row between" style="margin-top:8px"><span>End this session?</span><span class="row"><button class="btn ghost" data-act="endNo" style="min-height:40px">Keep cooking</button><button class="btn danger" data-act="endYes" style="min-height:40px">End</button></span></div>` : ""}
    <div class="progress">${D.map((d, di) => `<span class="pchip">${dot(di)}${esc(shortName(d.r))} <b>${Math.min(sess.dishes[di].next, d.steps.length)}/${d.steps.length}</b></span>`).join("")}</div>
    </div>
    <div class="body wrap">
      ${waits.length ? `<section class="ownway"><h3>Cooking on its own</h3><ul class="waits">${waits.map(w => { const key = `${w.di}.${w.n}`, ring = w.ms <= now; return `<li class="${ring ? "ring" : ""}">
        ${dot(w.di)}<span class="wl"><b>${esc(D[w.di].r.steps[w.n].t)}</b><br><span class="muted small">${esc(shortName(D[w.di].r))}</span></span>
        <span class="ctl">${ring ? `<span class="tt">Time's up</span><button class="btn primary sm" data-act="waitOk" data-di="${w.di}" data-n="${w.n}">OK</button>`
               : `<span class="tt" data-until="${w.ms}">${mmss(w.ms - now)}</span><button class="btn ghost sm" data-act="waitAdd" data-di="${w.di}" data-n="${w.n}" aria-label="Add a minute">+1m</button><button class="btn ghost sm" data-act="waitEnd" data-di="${w.di}" data-n="${w.n}">Done early</button>`}</span>
      </li>`; }).join("")}</ul></section>` : ""}
      ${done ? `<article class="now finished"><h2>All ${D.length} dishes are ready</h2><p class="muted">Finishing marks each one as made today.</p><button class="btn primary big" data-act="sessionFinish">Finish</button></article>` : nowCards.join("")}
      ${!done && upcoming.length ? `<section class="block"><h3>Coming up</h3><ol class="plan">${upcoming.slice(0, 5).map(t => { const i = taskInfo(D, t.key), m = Math.max(0, t.start - nowM); return `<li><span class="when">${m < 0.5 ? "next" : `~${Math.round(m)} min`}</span>${dot(t.dish)}<span><b>${esc(i.kind === "p" ? "Chop and measure" : i.title)}</b> <span class="muted">${esc(shortName(i.r))}</span></span></li>`; }).join("")}</ol></section>` : ""}
    </div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const app = $("#app");
  const active = document.activeElement?.id, selStart = document.activeElement?.selectionStart;
  const sameView = S.view === S._lastView && S.rid === S._lastRid && S.tab === S._lastTab;
  if (S.view === "edit" && !S.settings && sameView && !S._force) { renderTray(); return; }   // don't clobber a form being typed in
  const keepScroll = sameView ? window.scrollY : 0;
  let html;
  if (S.settings) html = viewSettings();
  else if (S.sessionOpen && S.session) html = viewSession();
  else if (S.together) html = viewSetup();
  else if (S.view === "edit") html = viewEdit();
  else if (S.tab === "shop") html = viewShop();
  else if (S.tab === "cmp") html = viewCompare();
  else if (S.view === "recipe") html = viewRecipe() + (S.cook ? viewCook() : "");
  else html = viewList();
  app.innerHTML = html;
  $("#tabs").hidden = S.view === "edit" || !!S.cook || S.settings || !!S.together || (S.sessionOpen && !!S.session) || !!S.pick;
  document.body.classList.toggle("locked", !!S.cook || (S.sessionOpen && !!S.session));
  $("#tab-recipes").setAttribute("aria-current", S.tab === "recipes" ? "page" : "false");
  $("#tab-shop").setAttribute("aria-current", S.tab === "shop" ? "page" : "false");
  $("#tab-cmp").setAttribute("aria-current", S.tab === "cmp" ? "page" : "false");
  const open = S.shop.filter(s => !s.done).length, b = $("#shopBadge");
  b.hidden = !open; b.textContent = open;
  document.body.style.overflow = S.cook ? "hidden" : "";
  if (active) { const el = document.getElementById(active); if (el) { el.focus({ preventScroll:true }); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch {} } }
  window.scrollTo(0, keepScroll);
  S._lastView = S.settings ? "settings" : S.view; S._lastRid = S.rid; S._lastTab = S.tab; S._force = false;
  renderTray();
}
const go = patch => { Object.assign(S, patch); S._force = true; S._lastView = null; render(); };

/* ---------- events ---------- */
document.addEventListener("input", e => {
  if (e.target.id === "q") { S.q = e.target.value; render(); return; }
  const id = e.target.dataset?.cmp; if (!id) return;
  const o = S.cmp.find(x => x.id === id); if (!o) return;
  o[e.target.dataset.k] = e.target.value; saveCmp(); paintCompare();
});
document.addEventListener("change", e => {
  const d = e.target.dataset?.day; if (d == null) return;
  S.sched = sched(); S.sched[+d] = e.target.value; lsSet("sched", S.sched); toast(`${DAYS[+d]}: ${PLANS[e.target.value].name}`);
});
// the suggestion depends on the clock, so refresh it when the app comes back to the front
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.view === "list" && !S.settings) { S.slot = null; render(); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "addForm") { const v = $("#addItem").value.trim(); if (v) { addShop([{ name:v }]); const i = $("#addItem"); if (i) { i.value = ""; i.focus(); } } }
  if (e.target.id === "tokenForm") turnOnSaving($("#f-token").value.trim());
});
async function turnOnSaving(t){
  if (!t) { toast("Paste the key first"); return; }
  S.busy = true; S._force = true; render();
  const problem = await checkToken(t);
  S.busy = false;
  if (problem) { S._force = true; render(); toast(problem); return; }
  S.token = t; lsSet("ghToken", t);
  S._force = true; render(); toast("Saving is on");
  // send anything that was waiting on this phone
  for (const r of Object.values(S.local).filter(l => !l._pushed)) await pushLocal(r, true);
}
async function pushLocal(r, quiet){
  try {
    await pushRecipe(r);
    S.local[r.id] = { ...S.local[r.id], _pushed:true }; lsSet("localRecipes", S.local);
    if (!quiet) toast("Saved for everyone. Other phones get it in about a minute");
    return true;
  } catch (err) {
    toast(err instanceof SaveError ? err.message : "Couldn't save. Try again");
    return false;
  }
}
$("#tab-recipes").onclick = () => { audio(); go({ tab:"recipes", view: S.view === "edit" ? "list" : S.view }); };
$("#tab-shop").onclick = () => { audio(); go({ tab:"shop", confirmClear:false }); };
$("#tab-cmp").onclick = () => { audio(); go({ tab:"cmp" }); };
window.addEventListener("hashchange", () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h && S.view === "recipe") go({ view:"list", rid:null, cook:null });
});

async function copy(text, ok){
  try { await navigator.clipboard.writeText(text); toast(ok); return true; }
  catch { toast("Couldn't copy. Long-press to select instead"); return false; }
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, r = S.recipes.find(x => x.id === S.rid);
  audio();
  switch (a) {
    case "tag": S.tag = b.dataset.tag || null; render(); break;
    case "tipx": S.tipHidden = true; lsSet("tipHidden", true); render(); break;
    case "open": history.pushState(null, "", "#" + encodeURIComponent(b.dataset.id)); go({ view:"recipe", rid:b.dataset.id }); wake(true); break;
    case "back": if (location.hash) history.pushState(null, "", location.pathname); go({ view:"list", rid:null }); wake(false); break;
    case "sc": { const cur = S.scale[r.id] || r.serves || 1; S.scale[r.id] = Math.max(1, Math.min(20, cur + +b.dataset.d)); render(); break; }
    case "check": { const c = S.checked[r.id] = S.checked[r.id] || {}; c[b.dataset.key] = !c[b.dataset.key]; lsSet("ck", S.checked); render(); break; }
    case "uncheck": S.checked[r.id] = {}; lsSet("ck", S.checked); render(); break;
    case "sub": { const k = r.id + b.dataset.key; S.openSub[k] = !S.openSub[k]; render(); break; }
    case "shop1": { const [gi, ii] = b.dataset.key.split(".").map(Number); addShop([{ name: shopText(r.groups[gi].items[ii], factor(r)), from: r.title }]); break; }
    case "shopAll": { const k = factor(r); addShop(r.groups.flatMap(g => g.items.filter(it => it.q != null).map(it => ({ name: shopText(it, k), from: r.title })))); break; }
    case "timer": {
      const s = r.steps[+b.dataset.i], t = durations(s.x)[+b.dataset.j]; if (!t) break;
      startTimer(`${s.t} · ${t.label}`, t.secs / 60); break;
    }
    case "tadd": { const t = S.timers.find(x => x.id === b.dataset.t); if (t) t.end += 60000; renderTray(); break; }
    case "tdone": S.timers = S.timers.filter(x => x.id !== b.dataset.t); renderTray(); break;
    case "cook": S.cook = { i:0 }; S.sheet = false; render(); wake(true); break;
    case "cookx": S.cook = null; S.sheet = false; render(); break;
    case "finish": S.cook = null; S.sheet = false; S.checked[r.id] = {}; lsSet("ck", S.checked); markMade(r.id); render(); toast("Finished and marked as made today"); break;
    case "made": markMade(r.id); render(); toast("Marked as made today"); break;
    case "unmade": unmarkMade(r.id); render(); break;
    case "slot": S.slot = b.dataset.slot === slotNow().plan ? null : b.dataset.slot; render(); break;
    case "next": S.cook.i = Math.min(r.steps.length - 1, S.cook.i + 1); render(); $("#cookBody")?.scrollTo(0,0); break;
    case "prev": S.cook.i = Math.max(0, S.cook.i - 1); render(); $("#cookBody")?.scrollTo(0,0); break;
    case "sheet": S.sheet = true; render(); break;
    case "sheetx": S.sheet = false; render(); break;
    case "stog": { const s = S.shop.find(x => x.id === b.dataset.id); if (s) { s.done = !s.done; saveShop(); render(); } break; }
    case "sdel": S.shop = S.shop.filter(x => x.id !== b.dataset.id); saveShop(); render(); break;
    case "clearAsk": S.confirmClear = true; render(); break;
    case "clearNo": S.confirmClear = false; render(); break;
    case "clearYes": S.confirmClear = false; S.shop = S.shop.filter(x => !x.done); saveShop(); render(); break;
    case "cmpAdd": {
      const o = newOpt(); o.unit = S.cmp[S.cmp.length - 1]?.unit || "g";   // usually the same unit as the last one
      S.cmp.push(o); saveCmp(); S._force = true; render();
      const el = document.getElementById("p-" + o.id); if (el) { el.focus(); el.scrollIntoView({ block:"center" }); }
      break;
    }
    case "cmpDel": S.cmp = S.cmp.filter(x => x.id !== b.dataset.id); saveCmp(); S._force = true; render(); break;
    case "cmpReset": S.cmp = [newOpt(), newOpt()]; saveCmp(); S._force = true; render(); window.scrollTo(0, 0); break;
    case "pickStart":
      if (S.session) { toast("Finish or end the current session first"); S.sessionOpen = true; fillHands(); go({}); wake(true); break; }
      S.pick = []; S._force = true; render(); break;
    case "pickToggle": {
      const id = b.dataset.id, i = S.pick.indexOf(id);
      if (i > -1) S.pick.splice(i, 1); else if (S.pick.length >= 4) { toast("Up to 4 dishes at a time"); break; } else S.pick.push(id);
      S._force = true; render(); break;
    }
    case "pickCancel": S.pick = null; S._force = true; render(); break;
    case "pickGo": go({ together: { ids: [...S.pick], servings: {}, mode: lsGet("togetherMode", "together"), hands: lsGet("togetherHands", 1) }, pick: null }); break;
    case "setupX": go({ pick: [...S.together.ids], together: null }); break;
    case "setupSet": {
      const k = b.dataset.k, v = k === "hands" ? +b.dataset.v : b.dataset.v;
      S.together[k] = v; lsSet(k === "hands" ? "togetherHands" : "togetherMode", v); S._force = true; render(); break;
    }
    case "setupServ": {
      const id = b.dataset.id, rr = S.recipes.find(x => x.id === id), cur = S.together.servings[id] || rr.serves || 1;
      S.together.servings[id] = Math.max(1, Math.min(20, cur + +b.dataset.d)); S._force = true; render(); break;
    }
    case "sessionStart":
      S.session = newSession(S.together); S.together = null; S.sessionOpen = true; S.confirmEnd = false; lastTick = Date.now();
      saveSession(); fillHands(); wake(true); go({}); break;
    case "sessionOpen": S.sessionOpen = true; fillHands(); wake(true); go({}); break;
    case "sessionClose": S.sessionOpen = false; S.confirmEnd = false; go({ view: "list", tab: "recipes" }); break;
    case "taskDone": case "taskSkip": completeTask(b.dataset.key, a === "taskSkip"); go({}); break;
    case "waitOk": S.timers = S.timers.filter(t => t.key !== `${b.dataset.di}.${b.dataset.n}`); renderTray(); go({}); break;
    case "waitAdd": { const di = +b.dataset.di, n = +b.dataset.n, cur = S.session.dishes[di].waitEnd[n]; changeWait(di, n, Math.max(Date.now(), cur) + 60000); go({}); break; }
    case "waitEnd": changeWait(+b.dataset.di, +b.dataset.n, null); go({}); break;
    case "endAsk": S.confirmEnd = true; S._force = true; render(); break;
    case "endNo": S.confirmEnd = false; S._force = true; render(); break;
    case "endYes": case "sessionFinish": {
      const ids = S.session?.ids || [];
      if (a === "sessionFinish") ids.forEach(markMade);
      S.timers = S.timers.filter(t => !t.key); renderTray();
      S.session = null; saveSession(); S.sessionOpen = false; S.confirmEnd = false; wake(false);
      go({ view: "list", tab: "recipes" });
      toast(a === "sessionFinish" ? `Nice. ${ids.length} dishes marked as made today` : "Session ended");
      break;
    }
    case "copy": copy(S.shop.filter(s => !s.done).map(s => s.name).join("\n"), "List copied"); break;
    case "toRem": {
      const open = S.shop.filter(s => !s.done);
      const txt = open.map(s => s.name).join("\n");
      open.forEach(s => s.done = true); saveShop(); render();
      location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT) + "&input=text&text=" + encodeURIComponent(txt);
      break;
    }
    case "new": go({ view:"edit", confirmDel:false, editing:{ title:"", prep:"", cook:"", total:"", serves:2, equip:"", tags:[], groups:[], steps:[], notes:[], source:"" } }); break;
    case "edit": { const { _local, _pending, _pushed, ...plain } = r; go({ view:"edit", confirmDel:false, editing: JSON.parse(JSON.stringify(plain)) }); break; }
    case "editx": go({ view: S.editing?.id ? "recipe" : "list" }); break;
    case "parse": {
      const p = parseMarkdown($("#f-paste").value);
      if (!p.title && !p.groups.length) { toast("Couldn't find a recipe in that text"); break; }
      const cur = S.editing;
      // Remember the saved steps/ingredients so hand-checked "goes in now" links survive unchanged steps.
      const orig = cur._orig || (cur.id ? { groups: cur.groups, steps: cur.steps } : null);
      S.editing = { ...cur, ...p, source: p.source || cur.source, tags: p.tags.length ? p.tags : cur.tags, ...(orig ? { _orig: orig } : {}) };
      S._force = true; render(); toast(cur.id ? "Replaced. Check it, then Save" : "Filled in. Check it, then Save");
      break;
    }
    case "save": {
      const v = id => $("#" + id).value.trim();
      const title = v("f-title"); if (!title) { toast("Give the recipe a name"); $("#f-title").focus(); break; }
      const old = S.editing;
      const doc = {
        id: old.id || "", title, prep:v("f-prep"), cook:v("f-cook"), total:v("f-total"),
        serves: Math.max(1, parseInt(v("f-serves")) || 2), equip:v("f-equip"),
        tags: v("f-tags").split(",").map(t => t.trim()).filter(Boolean),
        groups: textToIngs($("#f-ings").value),
        steps: textToSteps($("#f-steps").value),
        notes: $("#f-notes").value.split("\n").map(l => l.trim()).filter(Boolean),
        source: v("f-source") || null, no: old.no || "", updated: Date.now()
      };
      doc.steps = linkSteps(old._orig || old, doc.groups, doc.steps);
      if (old.servesNote) doc.servesNote = old.servesNote;
      if (!doc.id) { let id = slug(title), n = 2; while (S.recipes.some(x => x.id === id)) id = slug(title) + "-" + n++; doc.id = id; }
      S.deleted = S.deleted.filter(e => e.id !== doc.id); lsSet("deleted", S.deleted);   // saving brings a deleted recipe back
      S.local[doc.id] = doc; lsSet("localRecipes", S.local);   // always usable here straight away
      history.pushState(null, "", "#" + encodeURIComponent(doc.id));
      if (!S.token) { go({ view:"recipe", rid:doc.id, tab:"recipes" }); toast("Saved on this phone"); break; }
      S.busy = true; S._force = true; render();
      await pushLocal(doc);
      S.busy = false;
      go({ view:"recipe", rid:doc.id, tab:"recipes" });
      break;
    }
    case "push": {
      if (!S.token) { go({ settings:true }); break; }
      S.busy = true; render();
      await pushLocal(S.local[r.id]);
      S.busy = false; render();
      break;
    }
    case "settings": go({ settings:true }); break;
    case "settingsx": go({ settings:false }); break;
    case "tokenOff": S.token = ""; lsSet("ghToken", ""); go({ settings:true }); toast("Saving is off on this phone"); break;
    case "delAsk": S.confirmDel = true; S._force = true; render(); break;
    case "delNo": S.confirmDel = false; S._force = true; render(); break;
    case "delYes": {
      const d = S.editing; S.confirmDel = false;
      const onlyLocal = !S.shared.some(x => x.id === d.id) && !(S.local[d.id] && S.local[d.id]._pushed);
      if (!onlyLocal) {
        if (!S.token) { toast("Set up saving first, so the delete reaches every phone"); go({ settings:true }); break; }
        try { await deleteRecipe(d); }
        catch (err) { toast(err instanceof SaveError ? err.message : "Couldn't delete. Try again"); S._force = true; render(); break; }
        S.deleted = S.deleted.filter(e => e.id !== d.id); S.deleted.push({ id: d.id, at: Date.now() }); lsSet("deleted", S.deleted);
      }
      delete S.local[d.id]; lsSet("localRecipes", S.local);
      history.pushState(null, "", location.pathname);
      go({ view:"list", rid:null }); toast("Recipe deleted");
      break;
    }
  }
});
/* swipe between steps in cook mode */
let sx = null;
document.addEventListener("touchstart", e => { if (S.cook) sx = e.touches[0].clientX; }, { passive:true });
document.addEventListener("touchend", e => {
  if (!S.cook || sx == null || S.sheet) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  const r = S.recipes.find(x => x.id === S.rid); if (!r || Math.abs(dx) < 70) return;
  S.cook.i = Math.max(0, Math.min(r.steps.length - 1, S.cook.i + (dx < 0 ? 1 : -1))); render();
});

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
render();
load();
</script>
</body>
